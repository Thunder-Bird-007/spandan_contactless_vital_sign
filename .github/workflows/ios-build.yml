name: iOS build

on:
  push:
    branches: [ "ios-app", "main" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    # This is the whole point of this workflow: there is no Mac available to the
    # person who wrote this port, so this macOS runner is the only place the
    # Swift actually gets compiled and the unit tests actually get run before
    # anyone trusts them. See ios/README.md's verification-status section.
    runs-on: macos-14

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if "iPhone" in dev["name"]:
                      candidates.append((runtime, dev))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort(key=lambda rd: rd[0], reverse=True)
          print(candidates[0][1]["udid"])
          ')
          echo "Selected simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build (Simulator, no code signing needed)
        run: |
          xcodebuild build \
            -project Spandan.xcodeproj \
            -scheme Spandan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Spandan.xcodeproj \
            -scheme Spandan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
