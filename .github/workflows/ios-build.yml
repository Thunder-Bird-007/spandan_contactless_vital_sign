name: iOS build

on:
  push:
    branches: [ "ios-app", "main" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    # This is the whole point of this workflow: there is no Mac available to the
    # person who wrote this port, so this macOS runner is the only place the
    # Swift actually gets compiled and the unit tests actually get run before
    # anyone trusts them. See ios/README.md's verification-status section.
    runs-on: macos-14

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        # macos-14 runners ship several Xcode versions side by side. XcodeGen
        # writes the .pbxproj's objectVersion based on the *active* Xcode at
        # generate time; if that's older than the Xcode actually used to build
        # (or vice versa), xcodebuild refuses to open the project ("future
        # Xcode project file format"). Pin both steps to the same, newest
        # available Xcode so generate and build always agree.
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if "iPhone" in dev["name"]:
                      candidates.append((runtime, dev))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort(key=lambda rd: rd[0], reverse=True)
          print(candidates[0][1]["udid"])
          ')
          echo "Selected simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build (Simulator, no code signing needed)
        run: |
          xcodebuild build \
            -project Spandan.xcodeproj \
            -scheme Spandan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Debug - dump the built app's Info.plist
        run: |
          PLIST=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/Spandan.app/Info.plist" | head -n1)
          echo "Found: $PLIST"
          plutil -p "$PLIST" || true

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Spandan.xcodeproj \
            -scheme Spandan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
